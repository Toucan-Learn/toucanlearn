<section
  class="contact-section"
  aria-label="Toucan Learn enquiry form"
>
  <div class="container contact-width">

    <form
      class="enquiry-form"
      id="enquiry-form"
      action="https://formsubmit.co/joshuagordonjones@gmail.com"
      method="POST"
    >

      <input
        type="hidden"
        name="_subject"
        value="New Toucan Learn tutoring enquiry"
      />

      <input
        type="hidden"
        name="_template"
        value="table"
      />

      <input
        type="hidden"
        name="_captcha"
        value="false"
      />

      <input
        type="hidden"
        name="_next"
        value="https://toucan-learn.github.io/toucanlearn/thank-you.html"
      />

      <div class="honeypot" aria-hidden="true">

        <label for="company-website">
          Leave this field empty
        </label>

        <input
          id="company-website"
          name="_honey"
          type="text"
          tabindex="-1"
          autocomplete="off"
        />

      </div>

      <div class="fields-two">

        <div class="field">

          <label for="parent-name">
            Parent or carer name
          </label>

          <input
            id="parent-name"
            name="Parent or carer name"
            type="text"
            autocomplete="name"
            required
          />

        </div>

        <div class="field">

          <label for="email">
            Email address
          </label>

          <input
            id="email"
            name="email"
            type="email"
            autocomplete="email"
            required
          />

        </div>

        <div class="field">

          <label for="child-name">
            Child’s first name
          </label>

          <input
            id="child-name"
            name="Child's first name"
            type="text"
            required
          />

        </div>

        <div class="field">

          <label for="child-age">
            Child’s age
          </label>

          <input
            id="child-age"
            name="Child's age"
            type="text"
            inputmode="numeric"
            placeholder="For example: 10"
            required
          />

        </div>

      </div>

      <div class="field">

        <label for="support-needed">
          What support are you looking for?
        </label>

        <textarea
          id="support-needed"
          name="Support requested"
          required
          placeholder="Tell us what your child needs help with."
        ></textarea>

      </div>

      <label class="consent">

        <input
          name="Consent given"
          type="checkbox"
          value="Yes"
          required
        />

        <span>
          I agree that Toucan Learn may use these details
          to reply to my enquiry.
        </span>

      </label>

      <button class="button form-submit" type="submit">
        Send enquiry <span aria-hidden="true">→</span>
      </button>

    </form>

  </div>
</section>
