<!DOCTYPE html>
<html lang="en-GB">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact — Toucan Learn</title>
  <meta name="description" content="Get in touch with Toucan Learn. Tell us about your child and we'll take it from there.">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,600;12..96,700&family=Lexend:wght@300;400;500;600&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="style.css">
</head>
<body>

  <a class="skip-link" href="#main">Skip to content</a>

  <!-- ===== Header ===== -->
  <header class="site-header">
    <div class="container header-inner">
      <a class="brand" href="index.html" aria-label="Toucan Learn home">
        <svg class="brand-mark" viewBox="0 0 100 78" aria-hidden="true" focusable="false">
          <circle cx="34" cy="44" r="25" fill="#3d5a79"></circle>
          <path d="M50 31 C66 23 89 23 98 35 C85 41 67 43 53 40 Z" fill="#e07b43"></path>
          <path d="M53 45 C67 45 82 45 92 41 C84 51 68 54 54 50 Z" fill="#c85f2c"></path>
          <circle cx="29" cy="40" r="6" fill="#faf7f0"></circle>
          <circle cx="30.5" cy="41" r="2.7" fill="#22384c"></circle>
        </svg>
        <span class="brand-name">Toucan&nbsp;Learn</span>
      </a>

      <nav class="site-nav" aria-label="Primary">
        <a href="index.html">Home</a>
        <a class="nav-cta" href="contact.html" aria-current="page">Contact</a>
      </nav>
    </div>
  </header>

  <main id="main">

    <section class="band band-paper">
      <div class="container">
        <p class="section-label">Contact</p>

        <div class="contact-intro">
          <h1>Let's talk about your child.</h1>
          <p>Tell us a little about what you're looking for. We'll be in touch to arrange a free diagnostic session.</p>
        </div>

        <!-- ============================================================
             SET UP: replace YOUR_FORM_CODE below with the code from
             Formspree (the bit after /f/ in your form URL).
             Example: action="https://formspree.io/f/abcdwxyz"
             ============================================================ -->
        <form class="contact-form" id="contactForm"
              action="https://formspree.io/f/YOUR_FORM_CODE" method="POST">

          <div class="field">
            <label for="name">Name</label>
            <input type="text" id="name" name="name" placeholder="Your name" required autocomplete="name">
          </div>

          <div class="field">
            <label for="email">Email</label>
            <input type="email" id="email" name="email" placeholder="you@example.com" required autocomplete="email">
          </div>

          <div class="field">
            <label for="message">How we can help</label>
            <textarea id="message" name="message" placeholder="A few words about your child and what you're hoping for." required></textarea>
          </div>

          <div class="form-actions">
            <button type="submit" class="btn btn-primary" id="submitBtn">Send message</button>
            <span class="form-status" id="formStatus" role="status" aria-live="polite"></span>
          </div>
        </form>

        <p class="contact-alt">
          Prefer email? Write to us at
          <a href="mailto:joshuagordonjones@gmail.com">joshuagordonjones@gmail.com</a>.
        </p>
      </div>
    </section>

  </main>

  <!-- ===== Footer ===== -->
  <footer class="site-footer">
    <div class="container footer-inner">
      <div class="footer-brand">
        <svg class="brand-mark" viewBox="0 0 100 78" aria-hidden="true" focusable="false">
          <circle cx="34" cy="44" r="25" fill="#7d94ac"></circle>
          <path d="M50 31 C66 23 89 23 98 35 C85 41 67 43 53 40 Z" fill="#e07b43"></path>
          <path d="M53 45 C67 45 82 45 92 41 C84 51 68 54 54 50 Z" fill="#c85f2c"></path>
          <circle cx="29" cy="44" r="6" fill="#22384c"></circle>
          <circle cx="30.5" cy="41" r="2.7" fill="#faf7f0"></circle>
        </svg>
        <span>Toucan Learn</span>
      </div>
      <nav class="footer-nav" aria-label="Footer">
        <a href="index.html">Home</a>
        <a href="contact.html">Contact</a>
      </nav>
    </div>
  </footer>

  <script>
    (function () {
      var form = document.getElementById('contactForm');
      var status = document.getElementById('formStatus');
      var btn = document.getElementById('submitBtn');

      form.addEventListener('submit', function (e) {
        e.preventDefault();

        if (!form.checkValidity()) {
          form.reportValidity();
          return;
        }

        btn.disabled = true;
        status.textContent = 'Sending…';

        fetch(form.action, {
          method: 'POST',
          body: new FormData(form),
          headers: { 'Accept': 'application/json' }
        })
        .then(function (response) {
          if (response.ok) {
            form.reset();
            status.textContent = 'Thanks — your message is on its way. We\u2019ll be in touch soon.';
          } else {
            status.textContent = 'Something went wrong. Please email us directly instead.';
          }
        })
        .catch(function () {
          status.textContent = 'Something went wrong. Please email us directly instead.';
        })
        .finally(function () {
          btn.disabled = false;
        });
      });
    })();
  </script>

</body>
</html>
